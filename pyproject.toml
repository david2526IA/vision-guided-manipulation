[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vision-guided-manipulation"
version = "0.1.0"
description = "Simulation-first vision-to-grasp planning baseline."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "opencv-python-headless>=4.9", "PyYAML>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
vgm = "vision_guided_manipulation.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

